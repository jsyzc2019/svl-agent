name: External Orchestrator Attestation

on:
  workflow_dispatch:
    inputs:
      nonce:
        description: 'Nonce injected by local agent to bind this run'
        required: true
        default: 'NO-NONCE'

permissions:
  contents: write

jobs:
  attest:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Generate runner attestation
        env:
          INJECTED_NONCE: ${{ github.event.inputs.nonce }}
        run: |
          mkdir -p audit_external_orchestrator/runs
          OUT="audit_external_orchestrator/runs/attestation_${GITHUB_RUN_ID}.json"
          cat > "$OUT" <<JSON
          {
            "github_run_id": "${GITHUB_RUN_ID}",
            "github_run_attempt": "${GITHUB_RUN_ATTEMPT}",
            "runner_name": "${RUNNER_NAME}",
            "runner_os": "${RUNNER_OS}",
            "runner_arch": "${RUNNER_ARCH}",
            "github_actor": "${GITHUB_ACTOR}",
            "github_ref": "${GITHUB_REF}",
            "github_sha": "${GITHUB_SHA}",
            "github_workflow": "${GITHUB_WORKFLOW}",
            "hostname": "$(hostname)",
            "uname": "$(uname -a)",
            "whoami": "$(whoami)",
            "injected_nonce": "${INJECTED_NONCE}",
            "generated_at_utc": "$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          }
          JSON
          echo "Attestation written to $OUT on external runner."

      - name: Commit attestation back to repository
        run: |
          git config user.name "external-orchestrator[bot]"
          git config user.email "external-orchestrator[bot]@users.noreply.github.com"
          git add audit_external_orchestrator/runs/
          if git diff --cached --quiet; then
            echo "No changes to commit."
          else
            git commit -m "External orchestrator attestation (run ${GITHUB_RUN_ID})"
            git push
          fi
