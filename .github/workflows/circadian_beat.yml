name: Life Kernel · Circadian Base Beat (§4ba)

# v10 运行基地层：外部 runner 作为授时因子，心跳写回共享仓库。
# 诚实：平台 cron/dispatch 触发 ≠ 内核自发放电；Ambient 仍 0，未达 autotelic。
# 内核自身不联网、不 spawn；本工作流是平台调度的外部执行器（同 §109 已验证模式）。

on:
  schedule:
    # GitHub Actions cron 用 UTC；北京 = UTC+8，故 23:15 UTC = 北京次日 07:15（日出而作）
    - cron: '15 23 * * *'
  workflow_dispatch:
    inputs:
      nonce:
        description: '本机/用户注入的随机锚，绑定本次唤醒（可复现留痕）'
        required: false
        default: 'DISPATCH-NO-NONCE'

permissions:
  contents: write

jobs:
  beat:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout shared repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Run external-waker circadian beat
        env:
          BEAT_NONCE: ${{ github.event.inputs.nonce || 'SCHEDULED-NO-NONCE' }}
          # 平台侧不可伪造溯源：run_id/ref/sha/actor 由 GitHub 注入，非内核代填
          GITHUB_RUN_ID_CTX: ${{ github.run_id }}
          GITHUB_REF_CTX: ${{ github.ref }}
          GITHUB_SHA_CTX: ${{ github.sha }}
          GITHUB_ACTOR_CTX: ${{ github.actor }}
        run: |
          mkdir -p life_kernel/data
          python3.11 - <<'PY'
          import datetime, json, os, sys
          sys.path.insert(0, 'life_kernel')
          import kernel as K

          now = datetime.datetime.now(datetime.timezone.utc).replace(tzinfo=None)
          utc = now.strftime('%Y-%m-%dT%H:%M:%SZ')
          nonce = os.environ.get('BEAT_NONCE', '')
          woken_by = 'github_actions:run=%s:utc=%s' % (
              os.environ.get('GITHUB_RUN_ID_CTX', '?'), utc)
          runner_meta = {
              'github_run_id': os.environ.get('GITHUB_RUN_ID_CTX', ''),
              'github_ref': os.environ.get('GITHUB_REF_CTX', ''),
              'github_sha': os.environ.get('GITHUB_SHA_CTX', ''),
              'github_actor': os.environ.get('GITHUB_ACTOR_CTX', ''),
              'runner_os': os.environ.get('RUNNER_OS', ''),
              'generated_at_utc': utc,
          }

          # 消费本机接管指令（下行）：读收件箱最末一条可执行指令，仅作知情记录，
          # 不联网、不改判定；动作真正落地仍归外部/用户裁定。
          inbox = os.path.join('life_kernel', 'data', 'takeover_inbox.jsonl')
          last_takeover = None
          if os.path.exists(inbox):
              for line in open(inbox, encoding='utf-8'):
                  line = line.strip()
                  if line:
                      try:
                          req = json.loads(line)
                      except ValueError:
                          continue
                      if req.get('executable'):
                          last_takeover = req
          if last_takeover:
              K.takeover_request(
                  action='noop',
                  nonce=nonce,
                  note='consumed on runner: %s@%s' % (last_takeover.get('action'), last_takeover.get('at')),
              )

          # 上行心跳：外部 woken_by 唤醒内核跑节律，落带证据台账
          beat = K.base_beat(woken_by=woken_by, now=now, nonce=nonce,
                             runner_meta=runner_meta, record=True)
          print(json.dumps({'woken_by': woken_by, 'phase': beat.get('start_phase'),
                            'steps': beat.get('steps'), 'constitution_ok': beat.get('constitution_ok'),
                            'ambient_still_zero': beat.get('ambient_still_zero')},
                           ensure_ascii=False, indent=2))
          if beat.get('error'):
              sys.exit('base_beat refused: %s' % beat['error'])
          PY

      - name: Commit beat ledger back to shared repository
        run: |
          git config user.name "life-kernel-base[bot]"
          git config user.email "life-kernel-base[bot]@users.noreply.github.com"
          git add life_kernel/data/base_beat_log.jsonl life_kernel/data/circadian_log.jsonl life_kernel/data/takeover_inbox.jsonl 2>/dev/null || true
          if git diff --cached --quiet; then
            echo "No ledger changes to commit."
          else
            git commit -m "Base beat §4ba run ${GITHUB_RUN_ID}: external woken_by + takeover consumption"
            git push
          fi
