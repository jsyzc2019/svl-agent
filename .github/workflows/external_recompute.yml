name: External Orchestrator Recompute (§109)

on:
  workflow_dispatch:
    inputs:
      nonce:
        description: 'Nonce bound to this external recompute run'
        required: true
        default: 'NO-NONCE'

permissions:
  contents: write

jobs:
  recompute:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout locked commit
        uses: actions/checkout@v4

      - name: Verify frozen hashes then recompute §107 engine on external runner
        env:
          INJECTED_NONCE: ${{ github.event.inputs.nonce }}
          OUT_PATH: audit_external_orchestrator/runs/recompute_${{ github.run_id }}.json
        run: |
          mkdir -p audit_external_orchestrator/runs
          OUT="audit_external_orchestrator/runs/recompute_${GITHUB_RUN_ID}.json"
          python3 - <<'PY'
          import json, hashlib, os, subprocess, sys
          BASE = "audit_stratified_confirmation"
          def sha(p): return hashlib.sha256(open(p,"rb").read()).hexdigest()
          locks = {
            "engine.py": "2d207c321af89878d795fe8b834343d0945d5f84927df4b195a0ad813ad85ba2",
            "designer_P0/judge_P0_by_agent.py": "81cd853b4413cea8bc8133724166f292850756c1d07fd870f3f31c06340ff300",
            "designer_P1/judge_P1_by_agent.py": "4b410e5f159b3caf76501e452941b575d8b489de1f768ab8b38db70ad28be69f",
            "designer_P2/judge_P2_by_agent.py": "bba147942a29249a16b98b44c08aa2de492a0b39e8b5112fd0c0fc48cf46c04b",
            "scorer_key.json": "4ebe62abcd82dde344087dd45d0da1b88cc34920d1d7392a9d4487a20a75c779",
          }
          lock_ok = all(sha(os.path.join(BASE,k))==v for k,v in locks.items())
          # run the frozen engine fresh in this external environment
          r = subprocess.run([sys.executable, os.path.join(BASE,"engine.py")],
                             capture_output=True, text=True)
          result = json.load(open(os.path.join(BASE,"result.json")))
          result_sha = sha(os.path.join(BASE,"result.json"))
          out = {
            "experiment": "§109 外部 runner 重算 §107 裁决引擎",
            "runner_name": os.environ.get("RUNNER_NAME",""),
            "runner_os": os.environ.get("RUNNER_OS",""),
            "runner_arch": os.environ.get("RUNNER_ARCH",""),
            "hostname": os.uname().nodename,
            "uname": subprocess.run(["uname","-a"],capture_output=True,text=True).stdout.strip(),
            "whoami": os.environ.get("USER",""),
            "github_run_id": os.environ.get("GITHUB_RUN_ID",""),
            "github_run_attempt": os.environ.get("GITHUB_RUN_ATTEMPT",""),
            "github_sha": os.environ.get("GITHUB_SHA",""),
            "github_ref": os.environ.get("GITHUB_REF",""),
            "github_actor": os.environ.get("GITHUB_ACTOR",""),
            "injected_nonce": os.environ.get("INJECTED_NONCE",""),
            "generated_at_utc": subprocess.run(["date","-u","+%Y-%m-%dT%H:%M:%SZ"],capture_output=True,text=True).stdout.strip(),
            "frozen_locks_ok": lock_ok,
            "engine_exit_code": r.returncode,
            "engine_stdout_tail": r.stdout.strip().splitlines()[-3:],
            "external_result_sha256": result_sha,
            "external_verdict": result.get("verdict"),
            "external_P0_floor": result.get("P0_floor"),
            "external_core": result.get("core"),
            "external_lock_fields_ok": result.get("locks_ok"),
          }
          target = os.environ.get("OUT_PATH")
          json.dump(out, open(target,"w",encoding="utf-8"), ensure_ascii=False, indent=2)
          print("external recompute done; result_sha=", result_sha, "locks_ok=", lock_ok)
          PY

      - name: Commit external recompute attestation
        run: |
          git config user.name "external-orchestrator[bot]"
          git config user.email "external-orchestrator[bot]@users.noreply.github.com"
          git add audit_external_orchestrator/runs/
          if git diff --cached --quiet; then
            echo "No changes to commit."
          else
            git commit -m "External recompute attestation §109 (run ${GITHUB_RUN_ID})"
            git push
          fi
