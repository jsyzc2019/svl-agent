[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "svl-agent"
version = "0.13.1"
description = "Self-organizing judgment environments for verifiable narrative agents"
readme = "README.md"
requires-python = ">=3.10"
license = { file = "LICENSE" }
authors = [{ name = "SVL contributors" }]
keywords = ["agent", "verification", "self-evolution", "narrative", "evals"]
classifiers = [
  "Programming Language :: Python :: 3",
  "License :: OSI Approved :: MIT License",
  "Operating System :: OS Independent",
]
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=7"]

[project.urls]
Homepage = "https://github.com/jsyzc2019/svl-agent"

[project.scripts]
svl-audit = "svagent.cli:main"

[tool.setuptools]
packages = ["svagent"]

[tool.pytest.ini_options]
testpaths = ["tests", "life_kernel/tests"]
addopts = "-q"
