name: External Orchestrator Probe

on:
  workflow_dispatch:
    inputs:
      nonce:
        description: 'Nonce injected by the local agent to bind this run'
        required: true
        default: 'PROBE-NO-NONCE'

permissions:
  contents: write

jobs:
  attest:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Generate runner attestation
        env:
          INJECTED_NONCE: ${{ github.event.inputs.nonce }}
        run: |
          mkdir -p external_orchestrator_probe
          cat > external_orchestrator_probe/attestation.json <<EOF
          {
            "github_run_id": "${GITHUB_RUN_ID}",
            "github_run_attempt": "${GITHUB_RUN_ATTEMPT}",
            "runner_name": "${RUNNER_NAME}",
            "runner_os": "${RUNNER_OS}",
            "runner_arch": "${RUNNER_ARCH}",
            "runner_temp": "${RUNNER_TEMP}",
            "github_actor": "${GITHUB_ACTOR}",
            "github_ref": "${GITHUB_REF}",
            "github_sha": "${GITHUB_SHA}",
            "github_workflow": "${GITHUB_WORKFLOW}",
            "hostname": "$(hostname)",
            "uname": "$(uname -a)",
            "whoami": "$(whoami)",
            "injected_nonce": "${INJECTED_NONCE}",
            "generated_at_utc": "$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          }
          EOF
          echo "Attestation written on external runner."

      - name: Commit attestation back to repository
        run: |
          git config user.name "external-orchestrator[bot]"
          git config user.email "external-orchestrator[bot]@users.noreply.github.com"
          git add external_orchestrator_probe/attestation.json
          if git diff --cached --quiet; then
            echo "No changes to commit."
          else
            git commit -m "External orchestrator probe attestation (run ${GITHUB_RUN_ID}, nonce in file)"
            git push
          fi
